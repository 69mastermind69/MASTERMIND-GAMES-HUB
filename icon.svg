    fill="none"
    stroke="url(#neon)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <g fill="url(#neon)" opacity=".85">
    <rect x="252" y="224" width="34" height="34" rx="10"/>
    <rect x="300" y="224" width="34" height="34" rx="10"/>

    <rect x="252" y="272" width="34" height="34" rx="10"/>
