<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#17152b"/>
      <stop offset="55%" stop-color="#090912"/>
      <stop offset="100%" stop-color="#020205"/>
    </radialGradient>

    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="48%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <circle
    cx="256"
    cy="235"
    r="155"
    fill="none"
    stroke="#6d35ff"
    stroke-width="28"
    opacity=".12"
    filter="url(#softGlow)"
  />

  <rect
    x="72"
    y="72"
    width="368"
    height="368"
    rx="92"
    fill="none"
    stroke="url(#neon)"
    stroke-width="5"
    opacity=".8"
  />

  <rect
    x="91"
    y="91"
    width="330"
    height="330"
    rx="76"
    fill="none"
    stroke="#ffffff"
    stroke-width="1"
    opacity=".12"
  />

  <rect
    x="125"
    y="112"
    width="262"
    height="288"
    rx="52"
    fill="#07070d"
    stroke="url(#neon)"
    stroke-width="5"
    filter="url(#glow)"
  />

  <rect
